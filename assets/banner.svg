<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Gender Budget RAG banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#ffffff" opacity="0.07">
    <circle cx="80" cy="40" r="3"/><circle cx="140" cy="40" r="3"/><circle cx="200" cy="40" r="3"/>
    <circle cx="80" cy="280" r="3"/><circle cx="140" cy="280" r="3"/><circle cx="200" cy="280" r="3"/>
    <circle cx="1000" cy="40" r="3"/><circle cx="1060" cy="40" r="3"/><circle cx="1120" cy="40" r="3"/>
  </g>

  <!-- title block -->
  <text x="70" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">Gender Budget RAG</text>
  <rect x="72" y="150" width="190" height="6" rx="3" fill="url(#accent)"/>
  <text x="70" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e9d5ff">Question answering over Indian government gender budget documents</text>
  <text x="70" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#f5d0fe" opacity="0.9">Hybrid Retrieval  •  Cross-Encoder Reranking  •  Hindi + English  •  Grounded Answers</text>

  <!-- illustration: documents -> search -> answer -->
  <g transform="translate(860,70)">
    <!-- stacked documents -->
    <rect x="0" y="30" width="90" height="115" rx="8" fill="#ffffff" opacity="0.25"/>
    <rect x="12" y="18" width="90" height="115" rx="8" fill="#ffffff" opacity="0.45"/>
    <rect x="24" y="6" width="90" height="115" rx="8" fill="#ffffff"/>
    <rect x="38" y="26" width="60" height="7" rx="3" fill="#a78bfa"/>
    <rect x="38" y="44" width="48" height="6" rx="3" fill="#ddd6fe"/>
    <rect x="38" y="60" width="56" height="6" rx="3" fill="#ddd6fe"/>
    <!-- mini bar chart on document -->
    <rect x="40" y="96" width="10" height="14" fill="#f472b6"/>
    <rect x="56" y="86" width="10" height="24" fill="#c084fc"/>
    <rect x="72" y="78" width="10" height="32" fill="#fbbf24"/>

    <!-- arrow -->
    <path d="M130 70 L175 70" stroke="#fcd34d" stroke-width="5" stroke-linecap="round"/>
    <path d="M168 60 L180 70 L168 80" fill="none" stroke="#fcd34d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- magnifier -->
    <circle cx="232" cy="62" r="34" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="232" cy="62" r="22" fill="#ffffff" opacity="0.15"/>
    <path d="M256 88 L285 118" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <!-- answer bubble -->
    <rect x="160" y="140" width="150" height="46" rx="14" fill="url(#accent)"/>
    <path d="M190 186 L182 202 L204 186 Z" fill="#fbcfe8"/>
    <text x="235" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#3b0764">Answer + Source</text>
  </g>
</svg>
